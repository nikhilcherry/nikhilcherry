<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e0f1f"/><stop offset="1" stop-color="#17142e"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a371f7"/></marker>
  <style>
    .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace} .k{font:700 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;letter-spacing:.14em;fill:#a371f7} .s{font:500 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8d96b8}
    .t{font:700 15px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#eef1ff} .d{font:500 12px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8d96b8} .m{font:600 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;fill:#c9d0f0}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) backwards}
    @keyframes pop{from{transform:scale(0);opacity:0}}
    .fade{animation:fade .6s ease-out backwards} @keyframes fade{from{opacity:0}}
    .draw{stroke-dasharray:var(--l,400);animation:draw var(--t,1.2s) ease-out backwards}
    @keyframes draw{from{stroke-dashoffset:var(--l,400)}to{stroke-dashoffset:0}}
    .rise{animation:rise .6s ease-out backwards} @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    
    .kn{animation:shake .5s ease-in-out 0s 6, dim .6s ease-out 3.4s forwards}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
    @keyframes dim{to{opacity:.28}}
    .kn.hot{animation:shake .5s ease-in-out 0s 6, glow 1.8s ease-in-out 3.4s infinite}
    @keyframes glow{0%,100%{filter:drop-shadow(0 0 0 #a371f7)}50%{filter:drop-shadow(0 0 10px #a371f7)}}
    .tick{animation:pop .3s cubic-bezier(.2,.9,.3,1.3) backwards}
    
  </style>
</defs>
