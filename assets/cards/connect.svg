<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0d26"/><stop offset="1" stop-color="#1a1640"/></linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b7bff"/></marker>
  <style>
    .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace} .k{font:700 13px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;letter-spacing:.14em;fill:#8b7bff} .s{font:500 13px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8d96b8}
    .t{font:700 15px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#eef1ff} .d{font:500 12px ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#8d96b8} .m{font:600 12px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace;fill:#c9d0f0}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) backwards}
    @keyframes pop{from{transform:scale(0);opacity:0}}
    .fade{animation:fade .6s ease-out backwards} @keyframes fade{from{opacity:0}}
    .draw{stroke-dasharray:var(--l,400);animation:draw var(--t,1.2s) ease-out backwards}
    @keyframes draw{from{stroke-dashoffset:var(--l,400)}to{stroke-dashoffset:0}}
    .rise{animation:rise .6s ease-out backwards} @keyframes rise{from{opacity:0;transform:translateY(12px)}}
    
    .beam{animation:beam 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
    @keyframes beam{0%,100%{opacity:.15}50%{opacity:.6}}
    .pkt{offset-rotate:0deg}
    .wv{transform-box:fill-box;transform-origin:left center;animation:wv 1.8s ease-out infinite}
    @keyframes wv{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
    .ping{animation:ping 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.2);opacity:0}}
    
  </style>
</defs>
<rect width="800" height="450" rx="18" fill="url(#bg)"/>
<g stroke="#ffffff" stroke-opacity=".035"><path d="M0 90H800M0 180H800M0 270H800M0 360H800M133 0V450M266 0V450M400 0V450M533 0V450M666 0V450"/></g>
