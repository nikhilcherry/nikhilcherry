</g>
<g class="fade" style="animation-delay:.9s"><rect x="62" y="108" width="64" height="116" rx="12" fill="#12182f" stroke="#8b7bff" stroke-width="2"/><text class="d" x="94" y="140" text-anchor="middle" style="font-size:10px">scan page</text><text class="m" x="94" y="168" text-anchor="middle" style="fill:#c8ff3d;font-size:13px">4 1 2 ✓</text><text class="d" x="94" y="200" text-anchor="middle" style="font-size:10px">plate: last 4</text></g>
