<rect x="616" y="164" width="106" height="62" rx="10" fill="#2a2468"/><text class="t" x="626" y="184" style="font-size:11px">Someone is at</text><text class="t" x="626" y="198" style="font-size:11px">your Swift</text><text class="d" x="626" y="214" style="font-size:10px;fill:#c8ff3d">Blocking a car</text>
<rect x="616" y="240" width="92" height="28" rx="14" fill="#c8ff3d"/><text class="mono" x="662" y="258" text-anchor="middle" style="font:800 10px ui-monospace,monospace;fill:#0e1322">in 2 minutes</text></g>
<text class="d" x="669" y="316" text-anchor="middle" style="font-size:11px">the owner, family too</text>
<g class="rise" style="animation-delay:2.4s"><rect x="40" y="372" width="196" height="30" rx="15" fill="#1b1840" stroke="#4a43a0"/><text class="m" x="138" y="392" text-anchor="middle">no phone numbers shared</text></g>
<g class="rise" style="animation-delay:2.6s"><rect x="238" y="372" width="196" height="30" rx="15" fill="#1b1840" stroke="#4a43a0"/><text class="m" x="336" y="392" text-anchor="middle">works offline, by sound</text></g>
<g class="rise" style="animation-delay:2.8s"><rect x="454" y="372" width="137" height="30" rx="15" fill="#1b1840" stroke="#4a43a0"/><text class="m" x="522" y="392" text-anchor="middle">139 + 146 tests</text></g>
<g class="rise" style="animation-delay:3.0s"><rect x="612" y="372" width="100" height="30" rx="15" fill="#1b1840" stroke="#4a43a0"/><text class="m" x="662" y="392" text-anchor="middle">₹0 / month</text></g>
</svg>
