<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#4ab5e8"/><stop offset="1" stop-color="#a371f7"/></linearGradient>
    <style>
      .draw{stroke-dasharray:1700;animation:d 4.5s ease-out .3s backwards}
      @keyframes d{from{stroke-dashoffset:1700}to{stroke-dashoffset:0}}
      .fade{animation:f 1s ease-out backwards}
      @keyframes f{from{opacity:0}to{opacity:1}}
      .dot{animation:p 2.2s ease-in-out 3.6s infinite}
      @keyframes p{0%,100%{r:5;opacity:1}50%{r:9;opacity:.45}}
    </style>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M0 70H1200M0 140H1200M0 210H1200"/><path d="M200 0V280M400 0V280M600 0V280M800 0V280M1000 0V280"/>
  </g>
  <!-- a light curve: flat, noisy, one clean dip -->
  <path class="draw" fill="none" stroke="url(#ln)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
    d="M0 214 L40 212 L80 216 L120 211 L160 215 L200 212 L240 216 L280 213 L320 215 L360 211 L400 214 L440 212 L470 214 L490 240 L510 246 L690 246 L710 240 L730 214 L760 212 L800 216 L840 211 L880 215 L920 212 L960 216 L1000 213 L1040 215 L1080 211 L1120 214 L1160 212 L1200 214"/>
  <circle class="dot" cx="600" cy="246" r="5" fill="#a371f7"/>
  <text class="fade" x="60" y="104" font-size="64" font-weight="800" fill="#ffffff" style="animation-delay:.2s">Nikhil</text>
  <text class="fade" x="60" y="152" font-size="24" fill="#c9d1ff" style="animation-delay:.6s">I build systems where a measured result beats a demo.</text>
  <text class="fade" x="60" y="186" font-size="16" fill="#8b93c9" letter-spacing=".04em" style="animation-delay:1s">ML · hardware · mobile · developer tools   |   NMIT, Bengaluru</text>
  <text class="fade" x="600" y="272" font-size="12" fill="#8b93c9" text-anchor="middle" style="animation-delay:4s">one clean dip. work out what made it.</text>
</svg>
